# Wasila: the whole stack on one host (SPEC §11). wasila.app runs this file; see
# docs/DEPLOY.md.
#
#   cp deploy/.env.example deploy/.env      # then set your hosts and secrets
#   GIT_SHA=$(git rev-parse --short HEAD) docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml up -d
#
# Services: postgres (data volume), migrate (one-shot alembic upgrade), api (FastAPI + /mcp),
# worker (background jobs: AI research runs, profile prefill, removals), web (Next.js), caddy
# (TLS + reverse proxy). Only caddy publishes ports. Every container's log is capped at
# 5 x 20 MB, so a traffic spike cannot fill the disk.

name: wasila

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-api-env: &api-env
  WASILA_ENVIRONMENT: ${WASILA_ENVIRONMENT:-production}
  WASILA_DATABASE_URL: postgresql://${POSTGRES_USER:-wasila}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-wasila}
  WASILA_DB_POOL_SIZE: ${WASILA_DB_POOL_SIZE:-5}
  WASILA_PUBLIC_BASE_URL: https://${API_HOST:-api.wasila.app}
  WASILA_APP_URL: https://${WEB_HOST:-wasila.app}
  WASILA_CORS_ORIGINS: ${WASILA_CORS_ORIGINS:-[]}
  WASILA_SESSION_SECRET: ${WASILA_SESSION_SECRET:?set WASILA_SESSION_SECRET in deploy/.env}
  WASILA_SESSION_COOKIE_DOMAIN: ${WASILA_SESSION_COOKIE_DOMAIN:-wasila.app}
  WASILA_SESSION_COOKIE_SECURE: "true"
  WASILA_GOOGLE_CLIENT_ID: ${WASILA_GOOGLE_CLIENT_ID:-}
  WASILA_GOOGLE_CLIENT_SECRET: ${WASILA_GOOGLE_CLIENT_SECRET:-}
  WASILA_EMAIL_BACKEND: ${WASILA_EMAIL_BACKEND:-smtp}
  WASILA_EMAIL_FROM: ${WASILA_EMAIL_FROM:-Wasila <login@wasila.app>}
  WASILA_SMTP_HOST: ${WASILA_SMTP_HOST:-}
  WASILA_SMTP_PORT: ${WASILA_SMTP_PORT:-587}
  WASILA_SMTP_USERNAME: ${WASILA_SMTP_USERNAME:-}
  WASILA_SMTP_PASSWORD: ${WASILA_SMTP_PASSWORD:-}
  WASILA_SMTP_STARTTLS: ${WASILA_SMTP_STARTTLS:-true}
  WASILA_RATE_LIMIT_BACKEND: ${WASILA_RATE_LIMIT_BACKEND:-postgres}
  WASILA_MAX_WORKSPACES_PER_USER: ${WASILA_MAX_WORKSPACES_PER_USER:-10}
  WASILA_WORKSPACE_LIMIT_EXEMPT_EMAILS: ${WASILA_WORKSPACE_LIMIT_EXEMPT_EMAILS:-}
  WASILA_LOG_LEVEL: ${WASILA_LOG_LEVEL:-INFO}
  WASILA_LOG_JSON: "true"
  # Sign-in links per client IP per hour (default 100; raise it for an event on shared
  # Wi-Fi) and all outbound email per hour (default 500; keep it under your email plan).
  WASILA_MAGIC_LINKS_PER_IP_HOUR: ${WASILA_MAGIC_LINKS_PER_IP_HOUR:-}
  WASILA_EMAIL_GLOBAL_PER_HOUR: ${WASILA_EMAIL_GLOBAL_PER_HOUR:-}
  # AI research stays off unless switched on in deploy/.env (docs/DEPLOY.md "AI research").
  # api and worker both need the same WASILA_SECRETS_KEK.
  WASILA_RESEARCH_ENABLED: ${WASILA_RESEARCH_ENABLED:-false}
  WASILA_SECRETS_KEK: ${WASILA_SECRETS_KEK:-}
  WASILA_SECRETS_KEK_PREVIOUS: ${WASILA_SECRETS_KEK_PREVIOUS:-}
  WASILA_OPERATOR_EMAIL: ${WASILA_OPERATOR_EMAIL:-}
  WASILA_WORKER_CONCURRENCY: ${WASILA_WORKER_CONCURRENCY:-4}

services:
  postgres:
    logging: *logging
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wasila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-wasila}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  migrate:
    logging: *logging
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: wasila-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    logging: *logging
    image: wasila-api:local
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  worker:
    logging: *logging
    # Background job runner. Same image as the api, no ports. It serves no HTTP, so the
    # image's /healthz check is turned off here (it would always report unhealthy).
    image: wasila-api:local
    command: ["wasilactl", "worker"]
    healthcheck:
      disable: true
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # SIGTERM gives running jobs WASILA_WORKER_GRACE_S (50 s), then hands them back.
    stop_grace_period: 60s
    networks: [internal]

  web:
    logging: *logging
    build:
      context: ../web
      dockerfile: ../deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST:-api.wasila.app}
        NEXT_PUBLIC_SITE_URL: https://${WEB_HOST:-wasila.app}
        NEXT_PUBLIC_PUBLIC_API_URL: https://${API_HOST:-api.wasila.app}
        NEXT_PUBLIC_REPO_URL: ${NEXT_PUBLIC_REPO_URL:-https://github.com/applied-biosciences/wasila}
        # Empty hides every "Support Wasila" button (set it once GitHub Sponsors is live).
        NEXT_PUBLIC_SPONSOR_URL: ${NEXT_PUBLIC_SPONSOR_URL:-}
        GIT_SHA: ${GIT_SHA:-}
    image: wasila-web:local
    restart: unless-stopped
    environment:
      # Server components reach the API over the compose network, not the public internet.
      API_URL_INTERNAL: http://api:8000
    depends_on:
      - api
    networks: [internal]

  caddy:
    logging: *logging
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_HOST: ${WEB_HOST:-wasila.app}
      API_HOST: ${API_HOST:-api.wasila.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    # Fixed subnet: the API trusts X-Forwarded-For only from here (FORWARDED_ALLOW_IPS in
    # api.Dockerfile). Change both together.
    ipam:
      config:
        - subnet: 172.30.0.0/24
